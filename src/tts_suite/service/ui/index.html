<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>TTS-Suite</title>
  <link rel="icon" href="data:," />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="top">
    <h1>TTS-Suite</h1>
    <nav id="tabs" role="tablist"></nav>
    <div class="tools">
      <label class="token">
        <span data-i18n="token"></span>
        <!-- Not type="password": that makes the password manager of the browser offer itself on every field of the page. -->
        <input id="token" type="text" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" data-1p-ignore data-lpignore="true" />
      </label>
      <button id="language" type="button" class="small"></button>
      <button id="theme" type="button" class="small"></button>
    </div>
  </header>
  <main>
    <div id="message" role="status" hidden></div>
    <section id="view-catalog" class="view"></section>
    <section id="view-config" class="view" hidden></section>
    <section id="view-voices" class="view" hidden></section>
    <section id="view-speak" class="view" hidden></section>
  </main>
  <script type="module" src="app.js"></script>
</body>
</html>

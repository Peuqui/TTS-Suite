[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tts-suite"
version = "0.1.0"
description = "Text-to-speech as a service: engines in containers, an escalation list, one HTTP interface"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "requests",
    "edge-tts",
    # The Piper engine runs the `piper` program of this package, found next to the interpreter of
    # the service (large: it brings onnxruntime).
    "piper-tts==1.3.0",
]

[project.optional-dependencies]
# What `pytest tests` needs besides the service itself.
test = [
    "pytest",
    "httpx2",
]
dev = [
    "tts-suite[test]",
    "ruff",
    "mypy",
    "types-requests",
]

[project.scripts]
tts-suite = "tts_suite.service.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/tts_suite"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
